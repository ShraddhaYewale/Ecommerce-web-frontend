<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow - Online Shopping Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<!-- Hero -->
<section class="hero text-center">
  <div class="container">
    <h1 class="display-4 fw-bold mb-4">Welcome to ShopNow</h1>
    <p class="lead mb-5">Secure • Fast • Enjoyable Online Shopping Experience</p>
    <a href="shop.html" class="btn btn-lg btn-primary px-5">Start Shopping</a>
  </div>
</section>

<!-- Categories -->
<section class="py-5 bg-light">
  <div class="container">
    <h2 class="text-center mb-5">Explore Categories</h2>
    <div class="row g-4 text-center">
      <div class="col-6 col-md-3"><div class="card h-100 border-0 shadow-sm"><img src="https://images.unsplash.com/photo-1558769132-cb1aea458c5e?ixlib=rb-4.0.3&auto=format&fit=crop&w=500" class="card-img-top" alt="Fashion"><div class="card-body"><h5>Fashion</h5></div></div></div>
      <div class="col-6 col-md-3"><div class="card h-100 border-0 shadow-sm"><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=500" class="card-img-top" alt="Electronics"><div class="card-body"><h5>Electronics</h5></div></div></div>
      <div class="col-6 col-md-3"><div class="card h-100 border-0 shadow-sm"><img src="https://images.unsplash.com/photo-1606857521015-7f9fcf423740?ixlib=rb-4.0.3&auto=format&fit=crop&w=500" class="card-img-top" alt="Home"><div class="card-body"><h5>Home & Kitchen</h5></div></div></div>
      <div class="col-6 col-md-3"><div class="card h-100 border-0 shadow-sm"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?ixlib=rb-4.0.3&auto=format&fit=crop&w=500" class="card-img-top" alt="Accessories"><div class="card-body"><h5>Accessories</h5></div></div></div>
    </div>
  </div>
</section>

<!-- Featured Products -->
<section class="py-5">
  <div class="container">
    <h2 class="text-center mb-5">Featured Products</h2>
    <div class="row g-4" id="featured-products">
      <!-- Filled by JS below -->
    </div>
  </div>
</section>

<div id="site-footer"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

<!-- Sample featured products (later from API) -->
<script>
  const featured = [
    {id:1, name:"Wireless Earbuds Pro", price:3499, image:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=500"},
    {id:2, name:"Smart Fitness Band", price:2499, image:"https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?auto=format&fit=crop&w=500"},
    {id:3, name:"Portable Blender", price:1899, image:"https://images.unsplash.com/photo-1585237672814-8f85a8118bf6?auto=format&fit=crop&w=500"},
    {id:4, name:"Leather Backpack", price:4599, image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500"}
  ];

  const container = document.getElementById('featured-products');
  featured.forEach(p => {
    container.innerHTML += `
      <div class="col-md-3 col-sm-6">
        <div class="card h-100">
          <img src="${p.image}" class="product-img card-img-top" alt="${p.name}">
          <div class="card-body d-flex flex-column">
            <h6 class="card-title">${p.name}</h6>
            <p class="text-muted mt-auto">₹${p.price.toLocaleString('en-IN')}</p>
            <button class="btn btn-primary add-to-cart w-100"
                    data-id="${p.id}"
                    data-name="${p.name}"
                    data-price="${p.price}"
                    data-image="${p.image}">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    `;
  });
</script>

</body>
</html>
