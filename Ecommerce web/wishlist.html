<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist - ShopNow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="container py-5">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-lg-3 mb-4">
      <div class="profile-sidebar p-4 rounded shadow-sm">
        <ul class="nav flex-column account-nav">
          <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fas fa-home me-2"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html"><i class="fas fa-shopping-bag me-2"></i>Orders</a></li>
          <li class="nav-item"><a class="nav-link active" href="wishlist.html"><i class="fas fa-heart me-2"></i>Wishlist</a></li>
          <li class="nav-item"><a class="nav-link" href="settings.html"><i class="fas fa-cog me-2"></i>Settings</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="#"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
        </ul>
      </div>
    </div>

    <div class="col-lg-9">
      <h3 class="page-title mb-4">My Wishlist <span class="text-muted fs-6" id="wishlistCount"></span></h3>

      <div class="row g-4" id="wishlistGrid"></div>

      <div class="text-center mt-5" id="emptyWishlist" style="display:none;">
        <i class="far fa-heart fa-4x text-muted mb-3"></i>
        <h5>Your wishlist is empty</h5>
        <a href="shop.html" class="btn btn-primary mt-3">Start Adding Items</a>
      </div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

<script>
  // Sample saved items (later from API)
  let wishlist = [1, 5, 9, 11].map(getProduct);

  function renderWishlist() {
    const grid = document.getElementById('wishlistGrid');
    grid.innerHTML = wishlist.map(p => `
      <div class="col-md-4 col-sm-6 position-relative">
        <button class="btn btn-sm btn-light rounded-circle remove-wish shadow-sm" data-id="${p.id}" title="Remove">
          <i class="fas fa-trash text-danger"></i>
        </button>
        ${productCard(p, 'h-100')}
      </div>`).join('');
    document.getElementById('wishlistCount').textContent = `(${wishlist.length} items)`;
    document.getElementById('emptyWishlist').style.display = wishlist.length ? 'none' : 'block';
  }

  document.addEventListener('click', e => {
    const btn = e.target.closest('.remove-wish');
    if (!btn) return;
    wishlist = wishlist.filter(p => p.id !== Number(btn.dataset.id));
    renderWishlist();
  });

  renderWishlist();
</script>

</body>
</html>
