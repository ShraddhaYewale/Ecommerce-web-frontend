<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - ShopNow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<!-- Page Header -->
<section class="py-4 bg-light">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="h3 mb-0">All Products</h1>
      <div>
        <select class="form-select form-select-sm" id="sortSelect">
          <option selected>Sort by: Featured</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="name">Name: A-Z</option>
        </select>
      </div>
    </div>
  </div>
</section>

<!-- Main Shop Content -->
<section class="py-5">
  <div class="container">
    <div class="row">
      <!-- Sidebar Filters (expandable later) -->
      <div class="col-lg-3 mb-5">
        <div class="card border-0 shadow-sm p-3">
          <h5 class="mb-3">Categories</h5>
          <div class="list-group list-group-flush">
            <a href="#" class="list-group-item list-group-item-action active">All Products</a>
            <a href="#" class="list-group-item list-group-item-action">Electronics</a>
            <a href="#" class="list-group-item list-group-item-action">Fashion</a>
            <a href="#" class="list-group-item list-group-item-action">Home & Kitchen</a>
            <a href="#" class="list-group-item list-group-item-action">Beauty</a>
            <a href="#" class="list-group-item list-group-item-action">Sports</a>
          </div>

          <hr class="my-4">

          <h5 class="mb-3">Price Range</h5>
          <div class="mb-3">
            <input type="range" class="form-range" min="0" max="20000" step="500" id="priceRange">
            <div class="d-flex justify-content-between mt-2 small">
              <span>₹0</span>
              <span id="priceValue">₹20,000</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="col-lg-9">
        <div class="row g-4" id="productGrid">
          <!-- Products injected via JS -->
        </div>

        <!-- Pagination (static for now) -->
        <nav class="mt-5">
          <ul class="pagination justify-content-center">
            <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

<!-- Shop Products Data & Logic -->
<script>
  // Extended sample products (later replace with fetch('/api/products'))
  const allProducts = [
    {id:1, name:"Wireless Earbuds Pro", price:3499, image:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=500", category:"Electronics", desc:"Active noise cancellation"},
    {id:2, name:"Smart Fitness Band", price:2499, image:"https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?auto=format&fit=crop&w=500", category:"Electronics", desc:"Heart rate + steps"},
    {id:3, name:"Portable Blender", price:1899, image:"https://images.unsplash.com/photo-1585237672814-8f85a8118bf6?auto=format&fit=crop&w=500", category:"Home & Kitchen", desc:"USB rechargeable"},
    {id:4, name:"Leather Backpack", price:4599, image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500", category:"Fashion", desc:"15\" laptop compartment"},
    {id:5, name:"Running Shoes", price:3499, image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500", category:"Sports", desc:"Breathable mesh"},
    {id:6, name:"4K Action Camera", price:7999, image:"https://images.unsplash.com/photo-1502920917128-1aa500764cbd?auto=format&fit=crop&w=500", category:"Electronics", desc:"Waterproof 30m"},
    {id:7, name:"Silk Pillowcase", price:999, image:"https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?auto=format&fit=crop&w=500", category:"Home & Kitchen", desc:"Anti-aging hair & skin"},
    {id:8, name:"Bluetooth Speaker", price:2999, image:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=500", category:"Electronics", desc:"360° sound"},
  ];

  const productGrid = document.getElementById('productGrid');

  function renderProducts(products) {
    productGrid.innerHTML = '';
    products.forEach(p => {
      productGrid.innerHTML += `
        <div class="col-md-4 col-sm-6">
          <div class="card h-100">
            <img src="${p.image}" class="product-img card-img-top" alt="${p.name}">
            <div class="card-body d-flex flex-column">
              <h6 class="card-title">${p.name}</h6>
              <p class="text-muted small mb-2">${p.desc}</p>
              <p class="mt-auto fw-bold mb-3">₹${p.price.toLocaleString('en-IN')}</p>
              <button class="btn btn-primary add-to-cart w-100"
                      data-id="${p.id}"
                      data-name="${p.name}"
                      data-price="${p.price}"
                      data-image="${p.image}">
                Add to Cart
              </button>
            </div>
          </div>
        </div>
      `;
    });
  }

  // Initial render
  renderProducts(allProducts);

  // Basic client-side search
  document.getElementById('searchInput')?.addEventListener('input', e => {
    const term = e.target.value.toLowerCase().trim();
    const filtered = allProducts.filter(p => 
      p.name.toLowerCase().includes(term) || 
      p.desc.toLowerCase().includes(term)
    );
    renderProducts(filtered);
  });

  // Sort placeholder
  document.getElementById('sortSelect')?.addEventListener('change', e => {
    let sorted = [...allProducts];
    if (e.target.value === 'price-low') sorted.sort((a,b) => a.price - b.price);
    if (e.target.value === 'price-high') sorted.sort((a,b) => b.price - a.price);
    if (e.target.value === 'name') sorted.sort((a,b) => a.name.localeCompare(b.name));
    renderProducts(sorted);
  });
</script>

</body>
</html>
